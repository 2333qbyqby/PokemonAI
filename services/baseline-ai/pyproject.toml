[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[project]
name = "pokemonai-baseline"
version = "0.2.0"
description = "PokemonAI multi-format opponents with Champions VGC policy and team library"
requires-python = ">=3.12,<3.13"
license = { text = "AGPL-3.0-only" }
dependencies = [
  "poke-env @ https://github.com/cameronangliss/poke-env/archive/379a04628e42b2a2c94790c0788204b652f7ae1b.tar.gz",
  "PyYAML==6.0.2"
]

[project.optional-dependencies]
test = [
  "pytest==8.3.5",
  "pytest-asyncio==0.25.3"
]

[project.scripts]
pokemonai-baseline = "baseline_ai.runner:cli"
pokemonai-teams = "baseline_ai.team_cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/baseline_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
