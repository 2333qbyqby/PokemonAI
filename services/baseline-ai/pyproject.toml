[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "pokemonai-baseline"
version = "0.1.0"
description = "PokemonAI baseline opponents powered by poke-env"
requires-python = ">=3.12,<3.13"
license = { text = "AGPL-3.0-only" }
dependencies = [
  "poke-env==0.15.0",
  "PyYAML==6.0.2"
]

[project.optional-dependencies]
test = [
  "pytest==8.3.5",
  "pytest-asyncio==0.25.3"
]

[project.scripts]
pokemonai-baseline = "baseline_ai.runner:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/baseline_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
