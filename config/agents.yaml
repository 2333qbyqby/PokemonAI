default_format: champions-ranked-doubles
source_url: /pokemonai-source.tar.gz
team_sources_path: config/team-sources.yaml
team_library_path: var/generated/team-library/index.json

formats:
  - id: champions-ranked-doubles
    label: Champions 排位 64 双打
    mechanics: champions
    regulation: M-B
    base_showdown_format: gen9championsvgc2026regmb
    custom_rules: ["!Open Team Sheets"]
    showdown_format: "gen9championsvgc2026regmb@@@!Open Team Sheets"
    game_type: doubles
    roster_size: 6
    bring_size: 4
    active_slots: 2
    team_preview: bring6_pick4
    open_team_sheets: false
    level_rule: Adjust Level = 50
    team_pool: champions-ranked-doubles
    meta_bindings: [champions-battle-data, smogon, limitless, showdown-replays]
    policy_family: ranked-doubles
    description: 闭队表 BO1，六选四、双首发，Champions Regulation M-B。
  - id: champions-ranked-singles
    label: Champions 排位 63 单打
    mechanics: champions
    regulation: M-B
    base_showdown_format: gen9championsbssregmb
    custom_rules: []
    showdown_format: gen9championsbssregmb
    game_type: singles
    roster_size: 6
    bring_size: 3
    active_slots: 1
    team_preview: bring6_pick3
    open_team_sheets: false
    level_rule: Adjust Level = 50
    team_pool: champions-ranked-singles
    meta_bindings: [champions-battle-data, smogon, showdown-replays]
    policy_family: ranked-singles
    description: 闭队表 BO1，六选三、单首发，Champions Regulation M-B。
  - id: champions-ou
    label: Champions 66 OU 单打
    mechanics: champions
    regulation: OU
    base_showdown_format: gen9championsou
    custom_rules: []
    showdown_format: gen9championsou
    game_type: singles
    roster_size: 6
    bring_size: 6
    active_slots: 1
    team_preview: full_team
    open_team_sheets: false
    level_rule: Adjust Level = 50
    team_pool: champions-ou
    meta_bindings: [smogon, showdown-replays]
    policy_family: ou-singles
    description: 闭队表 BO1，六只全部参战，Champions OU 禁限。

opponents:
  - id: ranked-doubles-ai
    label: AI 对手
    username: PokemonAI Doubles
    backend: agent-runtime/strong
    format_id: champions-ranked-doubles
    difficulty: 10
    style: adaptive
  - id: ranked-singles-ai
    label: AI 对手
    username: PokemonAI Singles
    backend: agent-runtime/strong
    format_id: champions-ranked-singles
    difficulty: 10
    style: adaptive
  - id: ou-ai
    label: AI 对手
    username: PokemonAI OU
    backend: agent-runtime/strong
    format_id: champions-ou
    difficulty: 10
    style: adaptive
